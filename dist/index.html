<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Bingo Clash Pro - Enterprise Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        background-color: #FFF7EF;
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        user-select: none;
      }
      /* Custom animated glow effects */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes floatBall {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      .anim-pulse {
        animation: pulseGlow 2s infinite ease-in-out;
      }
      .anim-float {
        animation: floatBall 3s infinite ease-in-out;
      }
    </style>
  <script defer src="bundle.web.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
